name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test relay
        run: cargo test --manifest-path relay/Cargo.toml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :mcp-core:test

      - name: Assemble Hub, SDK, and bundled CapApps
        run: >-
          ./gradlew
          :mcp-intent-api:assembleDebug
          :llm-intentions:assembleDebug
          :tool-device:assembleDebug
          :tool-notify:assembleDebug
          :tool-people:assembleDebug
          :tool-files:assembleDebug
          :tool-files-dev:assembleDebug
          :taichi-android:assembleDebug

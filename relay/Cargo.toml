[package]
name = "intentions-relay"
version = "0.1.0"
edition = "2024"
description = "Outbound device relay for LLM Intentions"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8.9", features = ["json", "ws"] }
base64 = "0.22.1"
futures-util = "0.3.31"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.20"
